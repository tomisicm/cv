services:
  cv-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-web
    restart: unless-stopped

    # Bound to loopback: only cloudflared (running on this host as a systemd
    # service) can reach it. Never expose this on 0.0.0.0 — the tunnel is the
    # only public entrance.
    ports:
      - '127.0.0.1:3333:3333'

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3333/health >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

    # Hardening: the image already runs as the unprivileged `sws` user. These
    # options remove the writable filesystem, drop all Linux capabilities and
    # stop setuid binaries from gaining privileges. Resource limits keep a
    # request flood or a compromised process from hurting the host.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

    # TODO(security): cv-web still joins the shared `observability` network.
    # It only needs its loopback port. Remove this block when you are ready:
    #   - delete the `networks:` list here
    #   - delete the top-level `networks:` section
    #   - `docker compose up -d --force-recreate`
    # The static server does not currently need to reach Postgres, the dental
    # app or the monitoring stack, and Prometheus does not scrape cv-web
    # directly. See deploy/README.md §10.
    networks:
      - observability

networks:
  observability:
    external: true
    name: observability
