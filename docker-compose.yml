services:
  cv-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-web
    restart: unless-stopped

    # Bound to loopback: only cloudflared (running on this host as a systemd
    # service) can reach it. Never expose this on 0.0.0.0 — the tunnel is the
    # only public entrance.
    ports:
      - '127.0.0.1:3333:3333'

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3333/health >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

    networks:
      - observability

networks:
  observability:
    external: true
    name: observability
